<!DOCTYPE html>
<html lang="de" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebTV - TVheadend Player</title>
    <!-- Bulma 1.0 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.0/css/bulma.min.css">

    <style>
        /* Layout Reset & Fullscreen-Setup */
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000;
            font-family: BlinkMacSystemFont, -apple-system, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        /* Video Player in perfektem 16:9 Format zentriert */
        #videoPlayer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 56.25vw;
            max-height: 100vh;
            max-width: 177.78vh;
            object-fit: contain;
            z-index: 1;
            background: #000;
        }

        /* Platzhalter Overlay über dem Video */
        .player-placeholder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 56.25vw;
            max-height: 100vh;
            max-width: 177.78vh;
            z-index: 2;
            background: radial-gradient(circle, rgba(30, 35, 45, 1) 0%, rgba(10, 12, 16, 1) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: opacity 0.4s ease;
        }

        .player-placeholder.is-hidden {
            opacity: 0;
            pointer-events: none;
        }

        .placeholder-content {
            padding: 2rem;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Transparente Sidebar links mit Animation */
        .sidebar {
            position: absolute;
            top: 0;
            left: 0;
            width: 380px;
            height: 100vh;
            z-index: 10;
            background: rgba(15, 15, 20, 0.88);
            backdrop-filter: blur(12px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
            transform: translateX(0);
            opacity: 1;
        }

        .sidebar.is-hidden {
            transform: translateX(-100%);
            opacity: 0;
            pointer-events: none;
        }

        .sidebar-header {
            padding: 20px 20px 15px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .channel-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 15px;
        }

        .channel-list::-webkit-scrollbar {
            width: 6px;
        }

        .channel-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        /* Einzelne Sender-Items */
        .channel-item {
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .channel-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(4px);
        }

        .channel-item.is-active {
            background: rgba(0, 209, 178, 0.2);
            border-color: #00d1b2;
        }

        .channel-title {
            font-weight: 600;
            color: #fff;
            font-size: 1.05rem;
        }

        .epg-title {
            color: #b5b5b5;
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .epg-time {
            color: #888;
            font-size: 0.75rem;
        }

        .epg-progress {
            height: 3px !important;
            margin-top: 6px !important;
            background-color: rgba(255, 255, 255, 0.1) !important;
        }

        /* --- LADE-ANIMATION (SPINNER) --- */
        .loading-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .loading-spinner.is-hidden {
            opacity: 0;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #00d1b2;
            /* Akzentfarbe Bulma Teal */
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* --- TV-BOX INFOBAR (EINBLENDER UNTEN) --- */
        .tv-infobar {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(0);
            width: 90%;
            max-width: 800px;
            z-index: 9;
            background: rgba(15, 15, 20, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 16px 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
            opacity: 1;
        }

        .tv-infobar.is-hidden {
            transform: translateX(-50%) translateY(120%);
            opacity: 0;
            pointer-events: none;
        }

        .infobar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .infobar-channel-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #00d1b2;
        }

        .infobar-clock {
            font-size: 1.1rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
        }

        .infobar-epg-title {
            font-size: 1.05rem;
            font-weight: 500;
            color: #ffffff;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .infobar-progress-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 6px;
        }

        .infobar-progress-bar {
            height: 100%;
            background: #00d1b2;
            transition: width 0.3s ease;
        }

        .infobar-footer {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>

<body>

    <!-- 1. Fullscreen Player im Hintergrund -->
    <video id="videoPlayer" controls autoplay></video>

    <!-- Platzhalter Overlay wenn kein Sender läuft -->
    <div id="playerPlaceholder" class="player-placeholder">
        <div class="placeholder-content">
            <p class="is-size-1">📺</p>
            <p class="title is-4 has-text-white mt-2">Willkommen bei WebTV</p>
            <p class="subtitle is-6 has-text-grey-light">Wähle links einen Sender aus, um das Live-Programm zu starten.
            </p>
        </div>
    </div>

    <!-- Lade-Spinner während des Umschaltens -->
    <div id="loadingSpinner" class="loading-spinner is-hidden">
        <div class="spinner"></div>
    </div>

    <!-- TV-Box Infobar (Einblender von unten) -->
    <div id="tvInfobar" class="tv-infobar is-hidden">
        <div class="infobar-content">
            <div class="infobar-header">
                <span id="infoChannelTitle" class="infobar-channel-title">Sendername</span>
                <span id="infoClock" class="infobar-clock">00:00</span>
            </div>
            <div id="infoEpgTitle" class="infobar-epg-title">Lade EPG-Daten...</div>
            <div class="infobar-progress-container">
                <div id="infoProgressBar" class="infobar-progress-bar" style="width: 0%;"></div>
            </div>
            <div class="infobar-footer">
                <span id="infoEpgTime" class="infobar-epg-time">00:00 - 00:00</span>
            </div>
        </div>
    </div>

    <!-- 2. Transparente Sidebar links -->
    <div class="sidebar">
        <div class="sidebar-header">
            <a href="/" class="title is-4 has-text-white mb-1">📺 WebTV</a>
            <p class="subtitle is-7 has-text-grey-light">TVheadend Streamer</p>
        </div>

        <!-- Container für Senderliste -->
        <div id="channelList" class="channel-list">
            <p class="has-text-grey p-3">Lade Sender und EPG...</p>
        </div>
    </div>

    <script>
        let currentActiveChannel = null;
        let currentPlayingChannelId = null;
        let isSwitchingChannel = false;
        let infobarTimer = null;
        let cachedChannels = [];
        let cachedEpgEvents = {};

        // Uhrzeit in der Infobar laufend aktualisieren
        setInterval(() => {
            const clockEl = document.getElementById('infoClock');
            if (clockEl) {
                const now = new Date();
                clockEl.innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }
        }, 1000);

        // Hilfsfunktion: Formatierung von UNIX-Timestamps zu HH:MM Uhr
        function formatTime(timestamp) {
            if (!timestamp) return '--:--';
            const date = new Date(timestamp * 1000);
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        // TV-Box Infobar anzeigen & nach 4 Sek. automatisch ausblenden
        function showInfobar(channelId) {
            const infobar = document.getElementById('tvInfobar');
            if (!infobar) return;

            const channel = cachedChannels.find(c => c.uuid === channelId);
            const event = cachedEpgEvents[channelId];
            const now = Math.floor(Date.now() / 1000);

            if (channel) {
                document.getElementById('infoChannelTitle').innerText = channel.name;
            }

            if (event) {
                const startTime = formatTime(event.start);
                const stopTime = formatTime(event.stop);
                const totalDuration = event.stop - event.start;
                const elapsed = now - event.start;
                const progressPercent = Math.min(100, Math.max(0, (elapsed / totalDuration) * 100));

                document.getElementById('infoEpgTitle').innerText = event.title;
                document.getElementById('infoEpgTime').innerText = `${startTime} - ${stopTime}`;
                document.getElementById('infoProgressBar').style.width = `${progressPercent}%`;
            } else {
                document.getElementById('infoEpgTitle').innerText = "Keine EPG-Informationen verfügbar";
                document.getElementById('infoEpgTime').innerText = "--:-- - --:--";
                document.getElementById('infoProgressBar').style.width = "0%";
            }

            infobar.classList.remove('is-hidden');

            clearTimeout(infobarTimer);
            infobarTimer = setTimeout(() => {
                infobar.classList.add('is-hidden');
            }, 4000);
        }

        // Stream abspielen mit Lade-Spinner & Infobar
        async function playStream(channelId) {
            currentPlayingChannelId = channelId;
            if (isSwitchingChannel) return;
            isSwitchingChannel = true;

            const video = document.getElementById('videoPlayer');
            const placeholder = document.getElementById('playerPlaceholder');
            const spinner = document.getElementById('loadingSpinner');

            // 1. Platzhalter ausblenden
            if (placeholder) {
                placeholder.classList.add('is-hidden');
            }

            // 2. Spinner & Infobar aktivieren
            if (spinner) spinner.classList.remove('is-hidden');
            showInfobar(channelId);

            // 3. Sender in Liste markieren
            if (currentActiveChannel) {
                currentActiveChannel.classList.remove('is-active');
            }
            const selectedItem = document.getElementById(`channel-${channelId}`);
            if (selectedItem) {
                selectedItem.classList.add('is-active');
                currentActiveChannel = selectedItem;
            }

            // 4. Alten Stream trennen
            video.pause();
            video.removeAttribute('src');
            video.load();

            await new Promise(resolve => setTimeout(resolve, 150));

            // 5. Neuen Stream anstoßen
            video.src = `/video_proxy/${channelId}?t=${Date.now()}`;
            video.load();

            let attempts = 0;
            const maxAttempts = 2;

            const tryPlay = () => {
                video.play().then(() => {
                    console.log("Stream erfolgreich gestartet!");
                    if (spinner) spinner.classList.add('is-hidden');
                    isSwitchingChannel = false;
                }).catch(err => {
                    if (err.name === 'AbortError') {
                        isSwitchingChannel = false;
                        return;
                    }

                    console.warn(`Wiedergabeversuch ${attempts + 1} fehlgeschlagen, versuche erneut...`);
                    attempts++;

                    if (attempts < maxAttempts) {
                        setTimeout(() => {
                            console.log("Starte 2. Versuch automatisch...");
                            video.load();
                            tryPlay();
                        }, 1000);
                    } else {
                        console.error("Sender konnte nicht gestartet werden.");
                        if (spinner) spinner.classList.add('is-hidden');
                        isSwitchingChannel = false;
                    }
                });
            };

            tryPlay();
        }

        // Sender und EPG-Daten laden
        async function loadChannelsAndEPG() {
            const container = document.getElementById('channelList');

            try {
                const [channelsRes, epgRes] = await Promise.all([
                    fetch('/api/channels'),
                    fetch('/api/epg')
                ]);

                const channelsData = await channelsRes.json();
                const epgData = await epgRes.json();

                const now = Math.floor(Date.now() / 1000);
                cachedEpgEvents = {};

                if (epgData.entries) {
                    epgData.entries.forEach(event => {
                        if (event.start <= now && event.stop >= now) {
                            cachedEpgEvents[event.channelUuid] = event;
                        }
                    });
                }

                if (channelsData.entries) {
                    cachedChannels = channelsData.entries;
                }

                container.innerHTML = '';

                if (cachedChannels) {
                    cachedChannels.forEach(channel => {
                        const event = cachedEpgEvents[channel.uuid];
                        let epgHtml = '<div class="epg-title">Keine EPG-Daten</div>';

                        if (event) {
                            const startTime = formatTime(event.start);
                            const stopTime = formatTime(event.stop);
                            const totalDuration = event.stop - event.start;
                            const elapsed = now - event.start;
                            const progressPercent = Math.min(100, Math.max(0, (elapsed / totalDuration) * 100));

                            epgHtml = `
                        <div class="epg-title">${event.title}</div>
                        <div class="epg-time">${startTime} - ${stopTime}</div>
                        <progress class="progress is-primary epg-progress" value="${progressPercent}" max="100"></progress>
                    `;
                        }

                        const item = document.createElement('div');
                        item.id = `channel-${channel.uuid}`;
                        item.className = 'channel-item';
                        item.onclick = () => playStream(channel.uuid);

                        item.innerHTML = `
                    <div class="channel-title">${channel.name}</div>
                    ${epgHtml}
                `;

                        container.appendChild(item);
                    });
                }
            } catch (err) {
                console.error(err);
                container.innerHTML = `<div class="has-text-danger p-3">Fehler beim Laden!</div>`;
            }
        }

        // Auto-Hide Logik für Sidebar
        let hideTimer = null;
        const sidebar = document.querySelector('.sidebar');
        const channelList = document.getElementById('channelList');

        function resetHideTimer() {
            if (sidebar) sidebar.classList.remove('is-hidden');
            document.body.style.cursor = 'default';

            // Infobar ebenfalls einblenden, wenn aktuell ein Sender läuft
            if (currentPlayingChannelId) {
                showInfobar(currentPlayingChannelId);
            }

            clearTimeout(hideTimer);

            hideTimer = setTimeout(() => {
                if (sidebar) sidebar.classList.add('is-hidden');
                document.body.style.cursor = 'none';
            }, 3500);
        }

        window.addEventListener('mousemove', resetHideTimer);
        window.addEventListener('click', resetHideTimer);
        window.addEventListener('wheel', resetHideTimer);

        if (channelList) {
            channelList.addEventListener('scroll', resetHideTimer);
        }

        // Initialer Aufruf
        loadChannelsAndEPG();
        resetHideTimer();

        // EPG alle 60 Sekunden aktualisieren
        setInterval(loadChannelsAndEPG, 60000);
    </script>

</body>

</html>
